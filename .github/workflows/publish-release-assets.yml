name: 发布 6 个官方安装包附件

# 从一次成功的 release.yml 构建运行中取出 6 个官方安装包（Windows x86 房主/观看者、
# macOS Apple Silicon 与 Intel 各房主/观看者），校验 SHA-256 后以正式名称覆盖
# Release 上的同名附件（Windows x64 两个包仍由开发机构建后上传）。
# 本工作流只处理下列 12 个确定的附件名称，不修改 Release 说明，也不触碰其他附件。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 已成功的 release.yml 构建运行 ID
        required: true
        type: string
      source_commit:
        description: 构建源码的完整 40 位提交 SHA
        required: true
        type: string
      release_tag:
        description: 已存在的 Release 标签，例如 v0.4.3
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release-assets-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: 核对来源构建和目标 Release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'run_id 必须是正整数' >&2; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit 必须是完整的小写提交 SHA' >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo 'release_tag 格式无效' >&2; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" --jq '.id')
          jq -e --arg sha "$SOURCE_COMMIT" --argjson workflow "$workflow_id" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .workflow_id == $workflow' \
            <<< "$run" >/dev/null || { echo '构建状态、来源提交或工作流不匹配' >&2; exit 1; }
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag' <<< "$release" >/dev/null
          echo "RELEASE_ID=$(jq -r '.id' <<< "$release")" >> "$GITHUB_ENV"

      - name: 下载 Apple Silicon 产物
        uses: actions/download-artifact@v4
        with:
          name: macos-AppleSilicon
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/AppleSilicon

      - name: 下载 Intel 产物
        uses: actions/download-artifact@v4
        with:
          name: macos-Intel
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/Intel

      - name: 下载 Windows x86 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-x86
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/Windows-x86

      - name: 严格校验六个 ZIP、六个校验文件和十二条附件名称
        shell: bash
        run: |
          set -euo pipefail
          expected=()
          for arch in AppleSilicon Intel; do
            for role in Host Viewer; do
              archive="artifacts/$arch/WatchParty-$role-macOS-$arch.zip"
              sidecar="$archive.sha256"
              [[ -f "$archive" && -f "$sidecar" ]] || { echo "缺少附件：$archive" >&2; exit 1; }
              digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
              checksum_line=$(cat "$sidecar")
              checksum_line=${checksum_line%$'\r'}
              [[ "$checksum_line" == "$digest *${archive##*/}" ]] || { echo "SHA-256 不匹配：$archive" >&2; exit 1; }
              # 覆盖正式附件前先确认 ZIP 自身完整且索引可读。
              unzip -tq "$archive" >/dev/null || { echo "ZIP 结构损坏：$archive" >&2; exit 1; }
              expected+=("$archive" "$sidecar")
            done
          done
          for role in Host Viewer; do
            archive="artifacts/Windows-x86/WatchParty-$role-Windows-x86.zip"
            sidecar="$archive.sha256"
            [[ -f "$archive" && -f "$sidecar" ]] || { echo "缺少附件：$archive" >&2; exit 1; }
            digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
            checksum_line=$(cat "$sidecar")
            checksum_line=${checksum_line%$'\r'}
            [[ "$checksum_line" == "$digest *${archive##*/}" ]] || { echo "SHA-256 不匹配：$archive" >&2; exit 1; }
            unzip -tq "$archive" >/dev/null || { echo "ZIP 结构损坏：$archive" >&2; exit 1; }
            expected+=("$archive" "$sidecar")
          done
          [[ ${#expected[@]} -eq 12 ]] || { echo '附件数量必须为 12' >&2; exit 1; }
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(find artifacts -type f | sort)
          printf '%s\n' "${expected[@]}" > "$RUNNER_TEMP/publish-files.txt"
          echo '十二个候选附件均通过 SHA-256 与 ZIP 结构校验。'

      - name: 以正式名称覆盖上传并核对 GitHub SHA-256
        shell: bash
        run: |
          set -euo pipefail
          upload_dir=$(mktemp -d "$RUNNER_TEMP/publish.XXXXXX")
          trap 'rm -rf "$upload_dir"' EXIT

          remote_asset() {
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
              jq -c --arg name "$asset_name" '.assets[] | select(.name == $name)'
          }
          matches() {
            jq -e --arg digest "sha256:$digest" --argjson size "$size" \
              '.state == "uploaded" and .size == $size and .digest == $digest' \
              <<< "$1" >/dev/null
          }

          while IFS= read -r file; do
            asset_name=${file##*/}
            digest=$(sha256sum "$file" | cut -d ' ' -f 1)
            size=$(stat -c%s "$file")
            upload_path="$upload_dir/$asset_name"
            cp "$file" "$upload_path"

            existing=$(remote_asset)
            if [[ -n "$existing" ]] && matches "$existing"; then
              echo "远端内容已一致，跳过上传：$asset_name"
              continue
            fi

            verified=false
            for attempt in 1 2 3; do
              # 上传响应丢失时，先按远端 digest 判断是否已经成功，再决定是否重试。
              if ! gh release upload "$RELEASE_TAG" "$upload_path" --repo "$GITHUB_REPOSITORY" --clobber; then
                echo "上传连接中断，核对远端状态：$asset_name" >&2
              fi
              existing=$(remote_asset)
              if [[ -n "$existing" ]] && matches "$existing"; then
                verified=true
                break
              fi
              if [[ -n "$existing" ]]; then
                echo "第 $attempt 次上传后校验未通过（state=$(jq -r '.state' <<< "$existing") size=$(jq -r '.size' <<< "$existing")），重试：$asset_name" >&2
              fi
              [[ "$attempt" == 3 ]] || sleep 5
            done
            [[ "$verified" == true ]] || { echo "附件上传未完成：$asset_name" >&2; exit 1; }
            echo "GitHub digest 校验通过：$asset_name"
          done < "$RUNNER_TEMP/publish-files.txt"

          echo '六个官方安装包及其校验文件均已就绪；Release 说明和其他附件未修改。'
