name: 暂存 macOS Release 修复附件

# 仅上传带热修后缀的临时附件；不替换正式附件、不修改 Release 说明。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 已成功的 release.yml 构建运行 ID
        required: true
        type: string
      source_commit:
        description: 构建源码的完整 40 位提交 SHA
        required: true
        type: string
      release_tag:
        description: 已存在的 Release 标签，例如 v0.4.3
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: stage-macos-hotfix-${{ inputs.release_tag }}-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: 核对来源构建和目标 Release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'run_id 必须是正整数' >&2; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit 必须是完整的小写提交 SHA' >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo 'release_tag 格式无效' >&2; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" --jq '.id')
          jq -e --arg sha "$SOURCE_COMMIT" --argjson workflow "$workflow_id" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .workflow_id == $workflow' \
            <<< "$run" >/dev/null || { echo '构建状态、来源提交或工作流不匹配' >&2; exit 1; }
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag' <<< "$release" >/dev/null
          echo "RELEASE_ID=$(jq -r '.id' <<< "$release")" >> "$GITHUB_ENV"

      - name: 下载 Apple Silicon 产物
        uses: actions/download-artifact@v4
        with:
          name: macos-AppleSilicon
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/AppleSilicon

      - name: 下载 Intel 产物
        uses: actions/download-artifact@v4
        with:
          name: macos-Intel
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/Intel

      - name: 严格校验四个 ZIP 和八个附件名称
        shell: bash
        run: |
          set -euo pipefail
          expected=()
          for arch in AppleSilicon Intel; do
            for role in Host Viewer; do
              archive="artifacts/$arch/WatchParty-$role-macOS-$arch.zip"
              sidecar="$archive.sha256"
              [[ -f "$archive" && -f "$sidecar" ]] || { echo "缺少附件：$archive" >&2; exit 1; }
              digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
              checksum_line=$(cat "$sidecar")
              checksum_line=${checksum_line%$'\r'}
              [[ "$checksum_line" == "$digest *${archive##*/}" ]] || { echo "SHA-256 不匹配：$archive" >&2; exit 1; }
              expected+=("$archive" "$sidecar")
            done
          done
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(find artifacts -type f | sort)
          printf '%s\n' "${expected[@]}" > "$RUNNER_TEMP/macos-hotfix-files.txt"

      - name: 上传临时附件并核对 GitHub SHA-256
        shell: bash
        run: |
          set -euo pipefail
          suffix="macos-ui-hotfix-${SOURCE_COMMIT:0:7}"
          upload_dir=$(mktemp -d "$RUNNER_TEMP/macos-hotfix.XXXXXX")
          trap 'rm -rf "$upload_dir"' EXIT

          staged_asset() {
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
              jq -c --arg name "$staging_name" '.assets[] | select(.name == $name)'
          }
          matches() {
            jq -e --arg digest "sha256:$digest" --argjson size "$size" \
              '.state == "uploaded" and .size == $size and .digest == $digest' \
              <<< "$1" >/dev/null
          }

          while IFS= read -r file; do
            name=${file##*/}
            staging_name="$name.$suffix"
            digest=$(sha256sum "$file" | cut -d ' ' -f 1)
            size=$(stat -c%s "$file")
            upload_path="$upload_dir/$staging_name"
            cp "$file" "$upload_path"
            verified=false
            for attempt in 1 2 3; do
              asset=$(staged_asset)
              if [[ -n "$asset" ]]; then
                if matches "$asset"; then
                  verified=true
                  break
                fi
                [[ $(jq -r '.state' <<< "$asset") == starter ]] || {
                  echo "临时附件已存在但内容不匹配：$staging_name" >&2; exit 1;
                }
                # 只清理本次后缀下未完成的上传，绝不触及正式附件。
                asset_id=$(jq -r '.id' <<< "$asset")
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              fi
              # 上传响应丢失时，先按远端 digest 判断是否成功，再决定重试。
              if ! gh release upload "$RELEASE_TAG" "$upload_path" --repo "$GITHUB_REPOSITORY"; then
                echo "上传连接中断，核对远端状态：$staging_name" >&2
              fi
              asset=$(staged_asset)
              if [[ -n "$asset" ]] && matches "$asset"; then
                verified=true
                break
              fi
              if [[ -n "$asset" && $(jq -r '.state' <<< "$asset") != starter ]]; then
                echo "上传后的临时附件校验失败：$staging_name" >&2; exit 1;
              fi
              [[ "$attempt" == 3 ]] || sleep 3
            done
            [[ "$verified" == true ]] || { echo "临时附件上传未完成：$staging_name" >&2; exit 1; }
            echo "GitHub digest 校验通过：$staging_name"
          done < "$RUNNER_TEMP/macos-hotfix-files.txt"
          echo '八个 macOS 临时附件均已就绪；正式附件和 Release 说明未修改。'
