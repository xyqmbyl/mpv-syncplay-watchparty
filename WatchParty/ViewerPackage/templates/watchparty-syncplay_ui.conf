# WatchParty defaults: the package ships with the built-in AList disabled and
# no role selected, so a fresh install plays local files without any network
# setup. Open the panel with Ctrl+Shift+S -> 联机 -> 运行模式 and pick either
# 房主 (host) or 观看者 (viewer); the wizard then rewrites the AList entries
# below and enables sharing.
server=syncplay.pl:8995
room=mpv
name=
pipe=\\.\pipe\mpvpipe
auto_start=no

alist_enabled=no
alist_server=http://127.0.0.1:5244
alist_root=~~/../WatchParty/media
alist_virtual_root=/media
alist_map=
media_ready_timeout=30
http_readahead=20

tailscale_mode=off
tailscale_host=
