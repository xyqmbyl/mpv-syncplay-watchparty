# Minimal viewer profile for remote AList playback and Syncplay control.
idle=yes
force-window=yes
keep-open=yes
input-ipc-server=\\.\pipe\mpvpipe
osc=no

# Remote media needs read-ahead and byte-range friendly caching.
cache=yes
demuxer-readahead-secs=20

# Do not carry the host's playback history or machine-specific filters.
save-position-on-quit=no
speed=1.0
