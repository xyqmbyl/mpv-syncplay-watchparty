# WatchParty 合并包（Windows）：同一个包既是房主端也是观看者端，
# 界面与快捷键与本机 mpv 完全一致。共享部分（input-conf / profiles /
# script-opts / uosc / 字幕 / OSD 等）来自 mpv-base.conf，
# 下面只追加平台项和 WatchParty 必需项。
# 运行模式在 mpv 里选择：Ctrl+Shift+S -> 联机 -> 运行模式。
include = "~~/mpv-base.conf"

# --- Windows 平台项 ---
vo = gpu-next
gpu-context = d3d11
hwdec = d3d11va
hwdec-codecs = all
ao = wasapi
input-ipc-server = \\.\pipe\mpvpipe

# --- WatchParty 必需项（必须放在 include 之后以覆盖基础配置）---
idle = yes
force-window = yes
keep-open = yes
osc = no

# 房主播放本地媒体；观看者通过 AList/Tailscale 读取房主媒体。两种情况都
# 保留预读缓存，保证包间同步与远程读取流畅。
cache = yes
demuxer-readahead-secs = 20

# 不携带原机器的播放历史、滤镜与倍速。
save-position-on-quit = no
speed=1.0
