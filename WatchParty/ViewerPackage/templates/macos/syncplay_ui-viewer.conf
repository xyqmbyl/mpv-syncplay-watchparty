# macOS 观看者默认配置。本机只消费房主媒体，不发布任何本地路径。
server=syncplay.pl:8995
room=mpv
name=
pipe=~~/watchparty-mpv-ipc.sock
auto_start=no

alist_enabled=yes
alist_server=__ALIST_ORIGIN__
alist_root=
alist_virtual_root=/media
alist_map=
media_ready_timeout=30
http_readahead=20

tailscale_mode=viewer
tailscale_host=__TAILSCALE_HOST__
