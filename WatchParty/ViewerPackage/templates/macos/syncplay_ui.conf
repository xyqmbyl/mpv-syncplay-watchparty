# macOS 房主默认配置。首次设置（WatchParty/首次设置.command）
# 会把 alist_server 改写为 http://<Tailscale-IPv4>:5244。
server=syncplay.pl:8995
room=mpv
name=
pipe=~~/watchparty-mpv-ipc.sock
auto_start=no

alist_enabled=yes
alist_server=http://127.0.0.1:5244
alist_root=~~/../WatchParty/media
alist_virtual_root=/media
alist_map=
media_ready_timeout=30
http_readahead=20

tailscale_mode=host
tailscale_host=
