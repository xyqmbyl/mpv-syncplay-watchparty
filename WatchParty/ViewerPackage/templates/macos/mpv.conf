# WatchParty macOS 覆盖层配置：先加载与 Windows、房主、观看者共用的基础配置，
# 再用下面这些 macOS 专属设置覆盖它（include 之后的行优先级更高）。
# 房主与观看者共用同一个播放器配置，角色在「联机 → 运行模式」里选择。
include = "~~/mpv-base.conf"

# 通过 Unix socket 与 Syncplay 客户端通信。
idle=yes
force-window=yes
keep-open=yes
input-ipc-server=~~/watchparty-mpv-ipc.sock
osc=no

# 使用随包中文字体，避免 macOS 系统字体回退失败导致界面文字空白。
osd-font=LXGW WenKai Mono Lite
sub-font=LXGW WenKai Mono Lite

# 本地/远程媒体都需要对拖动友好的预读缓存。
cache=yes
demuxer-readahead-secs=20

# 不携带本机播放历史，也不改动用户全局 mpv 配置。
save-position-on-quit=no
speed=1.0
