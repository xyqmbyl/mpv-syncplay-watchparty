# WatchParty macOS：界面与快捷键与本机 mpv 完全一致（房主/观看者共用）。
# 共享部分（input-conf / profiles / script-opts / uosc / 字幕 / OSD 等）来自
# mpv-base.conf；下面只追加 macOS 平台项和 WatchParty 必需项。
include = "~~/mpv-base.conf"

# --- macOS 平台项（不指定 gpu-context，交给 mpv 自行选择 Cocoa/Metal）---
vo = gpu-next
hwdec = auto-safe
hwdec-codecs = all
ao = coreaudio
input-ipc-server = ~~/watchparty-mpv-ipc.sock

# --- WatchParty 必需项（必须放在 include 之后以覆盖基础配置）---
idle = yes
force-window = yes
keep-open = yes
osc = no

# 使用随包中文字体，避免 macOS 系统字体回退失败导致 UI 文字空白。
osd-font=LXGW WenKai Mono Lite
sub-font=LXGW WenKai Mono Lite

# 本地/远程媒体都需要对拖动友好的预读缓存。
cache = yes
demuxer-readahead-secs = 20

# 不携带原机器的播放历史、滤镜与倍速。
save-position-on-quit = no
speed=1.0
