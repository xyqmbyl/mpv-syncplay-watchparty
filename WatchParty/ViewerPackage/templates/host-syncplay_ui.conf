# Host defaults. The first-run wizard (WatchParty\房主首次运行.bat)
# rewrites alist_server to http://<Tailscale-IPv4>:5244 after checking
# Tailscale, the bundled AList and the /media storage.
server=syncplay.pl:8995
room=mpv
name=
pipe=\\.\pipe\mpvpipe
auto_start=no

alist_enabled=yes
alist_server=http://127.0.0.1:5244
alist_root=~~/../WatchParty/media
alist_virtual_root=/media
alist_map=
media_ready_timeout=30
http_readahead=20

tailscale_mode=host
tailscale_host=
