# Host profile: play local files from WatchParty\media (or anywhere) and
# share them through the bundled AList. The first-run wizard rewrites
# alist_server to the host's Tailscale IPv4 address.
idle=yes
force-window=yes
keep-open=yes
input-ipc-server=\\.\pipe\mpvpipe
osc=no

# Local media + in-room sync; keep caching friendly for shared playback.
cache=yes
demuxer-readahead-secs=20

# Do not carry the original machine's playback history or filters.
save-position-on-quit=no
speed=1.0
