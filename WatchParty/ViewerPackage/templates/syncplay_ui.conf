# Viewer package defaults. This computer consumes media from the host and
# never publishes a local path.
server=syncplay.pl:8995
room=mpv
name=
pipe=\\.\pipe\mpvpipe
auto_start=no

alist_enabled=yes
alist_server=__ALIST_ORIGIN__
alist_root=
alist_virtual_root=/media
alist_map=
media_ready_timeout=30
http_readahead=20

tailscale_mode=viewer
tailscale_host=__TAILSCALE_HOST__
