# Copy this file to portable_config/script-opts/syncplay_ui.conf and edit it.
server=syncplay.pl:8995
room=
name=
pipe=\\.\pipe\mpvpipe
auto_start=no

# Leave disabled until a host has configured a reachable public /d/ URL.
alist_enabled=no
alist_server=
alist_root=
alist_virtual_root=/media
alist_map=
media_ready_timeout=30
http_readahead=20

tailscale_mode=viewer
tailscale_host=
