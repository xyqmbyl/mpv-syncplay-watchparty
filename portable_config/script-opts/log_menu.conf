# WatchParty 日志选项（右键菜单「导航 > 日志」）
#
# enabled=yes|no
#     是否记录日志。关闭后 mpv 本体不再写日志文件，联机客户端也不会收到
#     --log-file（不写文件，行为与旧版一致）。默认 yes。
#
# retention_days=7|14|30|60|90
#     「立即清理一次」和启动时的自动清理保留多少天的日志，默认 30。
#
# 本文件可以直接手改（改完重启 mpv 生效），也可以从右键菜单「导航 > 日志」
# 里改——菜单里的每次改动都会整文件重写本文件。以 # 开头的行是注释。

enabled=yes
retention_days=30
