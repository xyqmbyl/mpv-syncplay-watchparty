# （2026-10-07 移除）此处原为 PlayKit 抄录的 Anime4K「低端 GPU」模板绑定（Mode A/B/C/A+A/C+A）：
#   它引用的是 Anime4K v3 时代的文件名（Clamp_Highlights / AutoDownscalePre_x2~x4 / Upscale_CNN_x2_S /
#   Restore_CNN_Soft_M / Upscale_Denoise_CNN_x2_M 等），这些文件在本机 shaders 目录中并不存在；
#   而且 CTRL+1~6 全部被下方「着色器」分组的同名按键覆盖（mpv 同名按键以后出现的为准），属于永不生效的死代码。
#   本机超分由 AI 超分 vf（~~/vs/MIX_UAI_NV_TRT.vpy，TensorRT AnimeJaNai V3.1 HD Balanced x2）承担，GLSL 只做修复/降噪/去色带/锐化，
#   所以那一整套官方放大链不再需要；确实想用 Anime4K 放大链时（低分辨率片源）见下方 Ctrl+6。

CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"

# 鼠标右键打开 uosc 菜单；也可以把按键换成 MENU、m 等，后面的 script-binding uosc/menu 保持为菜单动作。
MBTN_RIGHT script-binding uosc/menu
# 方向键上：音量增加 5；数字可改成 1、2、10 等步进。
UP add volume 5
# 方向键下：音量减少 5；数字越大，每次调节幅度越明显。
DOWN add volume -5
# 鼠标左键双击切换暂停/播放；cycle pause 会在 yes/no 间循环。
MBTN_LEFT_DBL cycle pause
# d 键后退一帧，适合暂停时逐帧检查画面。
d frame_back_step
# Shift+D 同样后退一帧；如果不需要大小写双绑定，可以改成其他动作。
D frame_back_step
# f 键前进一帧，适合暂停时逐帧检查画面。
f frame_step
# Shift+F 同样前进一帧；如果想保留 F 给全屏，可把这里改成其他键。
F frame_step
# x 键把播放速度降低 0.1；步进可改成 -0.05、-0.25 等。
x add speed -0.1
# Shift+X 同样降低播放速度 0.1；可按习惯改成不同步进。
X add speed -1
# c 键把播放速度提高 0.1；步进可改成 0.05、0.25 等。
c add speed 0.1
# Shift+C 同样提高播放速度 0.1；可按习惯改成不同步进。
C add speed 1
# z 键把播放速度重置为 1.0，即正常速度。
z set speed 1.0
# Shift+Z 同样把播放速度重置为正常速度。
Z set speed 1.0
# Ctrl+J 打开/切换 stats 统计面板；需要 stats.lua 可用，常用来看解码、掉帧、渲染耗时。
CTRL+j script-binding stats/display-stats
MBTN_Right script-message-to mpvnet show-menu
MBTN_RIGHT script-binding uosc/menu

#                  ignore                                                #! ---
 ~                 vf clr ""                                             #! VF 滤镜 > 清空
#                                                                        #! VF 滤镜 > ---
 !                 vf set vapoursynth="~~/vs/MEMC_MVT_LQ.vpy"            #! VF 滤镜 > 预设 补帧 MVTools_快速
 @                 vf set vapoursynth="~~/vs/MEMC_RIFE_DML.vpy"          #! VF 滤镜 > 预设 补帧 RIFE_DX12
 SHARP             vf set vapoursynth="~~/vs/MEMC_RIFE_NV.vpy"           #! VF 滤镜 > 预设 补帧 RIFE_RTX (Extra)
 ctrl+SHARP        vf add vapoursynth="~~/vs/MEMC_RIFE_NV.vpy"           #! VF 滤镜 > 追加 补帧 RIFE_RTX (Extra)
#                  ignore                                                #! VF 滤镜 > ---
 $                 vf set vapoursynth="~~/vs/MIX_UAI_DML.vpy"            #! VF 滤镜 > 预设 AI超分 UAI_DX12
 %                 vf set "@AI超分V3.1:vapoursynth=~~/vs/MIX_UAI_NV_TRT.vpy"   #! VF 滤镜 > 预设 AI超分 UAI_RTX_V3.1 (Extra)
 ctrl+%            vf add "@AI超分V3.1:vapoursynth=~~/vs/MIX_UAI_NV_TRT.vpy"   #! VF 滤镜 > 追加 AI超分 UAI_RTX_V3.1 (Extra)

