### ====================== 不映射菜单 ======================

 POWER             quit                                                  # 退出
 PLAY              set pause no                                          # 暂停
 PAUSE             set pause yes                                         # 播放
 PLAYPAUSE         cycle pause                                           # 暂停/播放
 STOP              stop                                                  # 停止
 REWIND            seek -30 ; script-message-to uosc flash-elements timeline   # 向前跳转30秒，刷新uosc进度条
 FORWARD           seek  30 ; script-message-to uosc flash-elements timeline   # 向后跳转30秒，刷新uosc进度条
 PREV              script-binding uosc/prev                              # uosc跳转上一个文件
 NEXT              script-binding uosc/next                              # uosc跳转下一个文件

 MBTN_BACK         script-binding uosc/prev
 MBTN_FORWARD      script-binding uosc/next
 MBTN_LEFT         ignore
 MBTN_LEFT_DBL     cycle fullscreen                                      # 全屏/窗口
 MBTN_MID          script-binding uosc/menu                              # 打开uosc菜单
 MBTN_RIGHT        script-binding uosc/menu
 Ctrl+MBTN_RIGHT   context-menu                                          # 打开原生菜单
 MBTN_RIGHT_DBL    ignore

WHEEL_DOWN         add volume -5 # 音量降低
WHEEL_UP           add volume  5  # 音量升高
 ENTER         cycle fullscreen
 SPACE             cycle pause
 Alt+WHEEL_DOWN    script-binding positioning/cursor-centric-zoom -0.1    # 缩小画面
 Alt+WHEEL_UP      script-binding positioning/cursor-centric-zoom  0.1    # 放大画面
 g                 ignore
 g-m               script-binding select/menu                             # 打开select总菜单
 g-p               script-binding select/show-properties                  # 打开select分菜单-属性列表

#Duke Enhanced
 \                 set speed 1.0
 r                 no-osd seek 0 absolute ; show-text "重新开始播放" 2000 ; set pause no
 f cycle-values "!reverse" video-rotate "no" "270" "180" "90"
 ctrl+f            add current-window-scale  0.1
 ctrl+d            add current-window-scale  -0.1

#MediaInfo
Alt+i    script-binding stats_mediainfo/display_toggle   # 常驻显示/关闭 MediaInfo 数据
Ctrl+i   script-binding stats_mediainfo/copy2clipboard   # 复制当前文件的 MediaInfo 信息到系统剪贴板
Ctrl+F5       script-binding stats_mediainfo/refresh          # 移除已缓存的MediaInfo数据
LEFT seek -3
RIGHT seek 3
ALT+LEFT  add sub-pos -1
ALT+RIGHT add sub-pos +1
ALT+UP    add sub-scale +0.05
ALT+DOWN  add sub-scale -0.05
