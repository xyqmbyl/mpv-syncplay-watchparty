# 鼠标右键打开 uosc 菜单；也可以把按键换成 MENU、m 等，后面的 script-binding uosc/menu 保持为菜单动作。
MBTN_RIGHT script-binding uosc/menu
# 方向键上：音量增加 5；数字可改成 1、2、10 等步进。
UP add volume 5
# 方向键下：音量减少 5；数字越大，每次调节幅度越明显。
DOWN add volume -5
# 鼠标左键双击切换暂停/播放；cycle pause 会在 yes/no 间循环。
MBTN_LEFT_DBL cycle pause
# d 键后退一帧，适合暂停时逐帧检查画面。
d frame_back_step
# Shift+D 同样后退一帧；如果不需要大小写双绑定，可以改成其他动作。
D frame_back_step
# f 键前进一帧，适合暂停时逐帧检查画面。
f frame_step
# Shift+F 同样前进一帧；如果想保留 F 给全屏，可把这里改成其他键。
F frame_step
# x 键把播放速度降低 0.1；步进可改成 -0.05、-0.25 等。
x add speed -0.1
# Shift+X 同样降低播放速度 0.1；可按习惯改成不同步进。
X add speed -1
# c 键把播放速度提高 0.1；步进可改成 0.05、0.25 等。
c add speed 0.1
# Shift+C 同样提高播放速度 0.1；可按习惯改成不同步进。
C add speed 1
# z 键把播放速度重置为 1.0，即正常速度。
z set speed 1.0
# Shift+Z 同样把播放速度重置为正常速度。
Z set speed 1.0
# Ctrl+J 打开/切换 stats 统计面板；需要 stats.lua 可用，常用来看解码、掉帧、渲染耗时。
CTRL+j script-binding stats/display-stats
MBTN_Right script-message-to mpvnet show-menu
MBTN_RIGHT script-binding uosc/menu

