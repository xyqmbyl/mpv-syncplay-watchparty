 ##############
 # 配置预设组 #
 ##############

[speed_limit1]
 profile-desc = 速度变化下限的控制
 profile-cond = p.speed<0.1
 speed = 0.1


[speed_limit2]
 profile-desc = 速度变化上限的控制
 profile-cond = p.speed>8
 speed = 8


[ontop_playback]
 profile-desc = 基于播放状态的自动置顶
#profile-cond = not pause and not p.idle_active   # 未自动启用
 profile-restore = copy
 ontop = yes


## https://github.com/mpv-player/mpv/issues/11122
[vsync_auto]
 profile-desc = 基于帧率或垂直同步率或速率的自动视频同步
 profile-cond = p.container_fps>32 or (p.display_fps/p.container_fps)>3.2 or p.speed~=1
 profile-restore = copy
 interpolation = no
 video-sync = audio


#[deband_bitrate]
# profile-desc = 基于码率的自动去色带
# profile-cond = ((p.file_size/1024)*8)/p.duration<=3000
# profile-restore = copy
# deband = yes


[save_props_auto]
 profile-desc = 基于进度或时长或视频轨类型的自动保存属性
 profile-cond = p.percent_pos>=90 or p.duration<=300 or not vid or p["current-tracks/video/albumart"] or p["current-tracks/video/image"]
 profile-restore = copy
 save-position-on-quit = no


[HDR_generic]
 profile-desc = hdr通用
 profile-cond = p["video-params/sig-peak"]>1
 profile-restore = copy
 blend-subtitles = no
#tone-mapping = hable
#gamut-mapping-mode = clip
 hdr-reference-white = 100
 hdr-peak-percentile = 99.99
#target-peak = 100
#sub-color = 0.7
#sub-border-color = 0.1
#sub-back-color = "#00000000"
#sub-shadow-offset = 0



########
# 倍速相关的画质档位
########

# 1× 最高画质档（2026-10-08 应用户决定）：四链 = hdeband + CNN_L + GAN_UL_R2(最重) + 锐化 lite。
# 预算 41.7 ms/帧，2026-10-08 实测 21.04 ms/帧、余量 2.0x、0 掉帧（m8r）；本 profile 兼任 Ctrl+0 清空着色器后回 1× 的自动恢复。
# 2×（预算 20.85 ms/帧）只挂三链（hdeband+CNN_L+锐化，实测 3.94 ms/帧、0 掉帧）——GAN 加进 2× 实测 23.35ms/帧超预算、
# 掉 419 帧/30s（m7），故 GAN 仅存在于本 1× 档。
# 红线：不要同时开两个挂着 CNN_L 的实例（双重型实测爆预算，146~715 掉帧/30s；单侧对默认配置对手安全，已复跑裁决）。
# 详见 mpv.conf 常驻链上方说明。
[hq_restore_1x]
profile-cond = p.speed<1.05 and p.speed>0.95
profile-restore = copy
glsl-shaders = "~~/shaders/Deband/hdeband.glsl;~~/shaders/Anime4K/Anime4K_Restore_CNN_L.glsl;~~/shaders/Anime4K/Anime4K_Restore_GAN_UL_R2.glsl;~~/shaders/Adaptive_sharpen/Adaptive_sharpen_lite_RT.glsl"
